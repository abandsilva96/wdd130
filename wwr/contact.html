<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapid Rafts</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description" content="Contact Us Page for Rapid Rafts ">
    <meta name="author" content="Abner Goncalves">
</head>

<body>
    <header>
        <img src="images/rapidslogo.jpeg" alt="Rafting Boat with two padels">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>

        <h1>Rapids Raft - Contact Information</h1>

        <section class="contact-info">
            <address>
                <p>123 Rafts Way - Windmere, UK</p>
                <p>871-234-786</p>
                <p>rapidrafts@hotmail.com</p>
            </address>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d591466.092914489!2d-3.624928586357264!3d54.6143078!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6162dea163128f21%3A0xe1693f56ff067a84!2sWhitewater%20North!5e0!3m2!1spt-BR!2suk!4v1786204811793!5m2!1spt-BR!2suk"
              width="400" height="300" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Image of John Martin">
                <figcaption>John Martin - Owner & Rafting Manager</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="Image of Martin Steward">
                <figcaption>Martin Steward - Rafting Guide </figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Image of Lena Connor">
                <figcaption>Lena Connor - Rafting Guide</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>
                <label for="fullname">Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>


    </main>
    <footer>
        <p>© 2026 | Rafting Company Name | Abner Goncalves</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://www.linkedin.com/">
                <img src="images/linkedin-square.svg" alt="LinkedIn Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
